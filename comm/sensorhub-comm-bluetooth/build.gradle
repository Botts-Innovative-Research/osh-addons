buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20'
    }
}

apply plugin: 'org.jetbrains.kotlin.jvm'

description = 'BLE Communication Provider'
ext.details = 'Cross-platform Bluetooth Low Energy communication provider using Kable'

kotlin {
    jvmToolchain(17)
}

def thisProjectDir = projectDir
rootProject.allprojects {
    repositories {
        mavenCentral()
    }
}

dependencies {
    implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
    embeddedImpl 'com.juul.kable:kable-core-jvm:0.42.0'
    embeddedImpl 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.9.0'
}

osgi {
    manifest {
        attributes('Bundle-Vendor': 'Botts Innovative Research, Inc.')
        attributes('Bundle-Activator': 'com.botts.impl.comm.bluetooth.Activator')
    }
}

ext.pom >>= {
    developers {
        developer {
            id 'billbrown'
            name 'Bill Brown'
            organization 'Botts Innovative Research, Inc.'
            organizationUrl 'https://www.botts-inc.com'
        }
    }
}
