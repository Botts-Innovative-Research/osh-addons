description = 'GoPro Video Driver'
ext.details = "Driver for GoPro cameras, adding support for multiple video/audio tracks and GPMF telemetry"
version = '1.0.0'

dependencies {
    implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
    implementation project(':sensorhub-driver-ffmpeg')
    testImplementation('junit:junit:4.13.1')
}

// exclude the diagnostic that reads a full recording from src/test/resources
// run it manually when investigating a specific camera's telemetry:
//   gradlew :sensorhub-driver-gopro:test --tests "*GpmfFileDumpTest"
test {
    useJUnit()
    exclude '**/GpmfFileDumpTest.class'
}

// add info to OSGi manifest
osgi {
    manifest {
        attributes('Bundle-Vendor': 'Botts Innovative Research, Inc.')
        attributes('Bundle-Activator': 'org.sensorhub.impl.sensor.gopro.Activator')
    }
}

// add info to maven pom
ext.pom >>= {
    developers {
        developer {
            name 'Kyle Fitzpatrick'
            organization 'Botts Innovative Research, Inc.'
            organizationUrl 'http://www.botts-inc.com'
        }
    }
}
