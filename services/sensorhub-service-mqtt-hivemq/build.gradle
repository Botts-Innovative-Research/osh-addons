description = 'MQTT Server (HiveMQ)'
ext.details = 'Implementation of MQTT client/server API using HiveMQ'
version = '1.0.0'


dependencies {
  implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
  implementation project(':sensorhub-comm-mqtt')
  embeddedImpl('com.hivemq:hivemq-community-edition-embedded:2023.8') {
    exclude group: 'com.google.guava', module: 'guava'
    exclude group: 'ch.qos.logback', module: 'logback-classic'
    exclude group: 'org.slf4j', module: 'slf4j-api'
  }
  
  // override vulnerable libraries bundled with HiveMQ CE 2023.8
  embeddedImpl platform('com.fasterxml.jackson:jackson-bom:2.18.11') // was 2.15.2
  embeddedImpl platform('io.netty:netty-bom:4.1.139.Final')          // was 4.1.94.Final
  constraints {
    embeddedImpl('org.bouncycastle:bcprov-jdk18on:1.86')             // was 1.75
    embeddedImpl('org.bouncycastle:bcpkix-jdk18on:1.86')
    embeddedImpl('org.bouncycastle:bcutil-jdk18on:1.86')
    embeddedImpl('org.apache.commons:commons-compress:1.28.0')       // was 1.23.0
    embeddedImpl('commons-io:commons-io:2.22.0')                     // was 2.13.0
  }
}

// add info to OSGi manifest
osgi {
  manifest {
    attributes('Bundle-Vendor': 'Sensia Software LLC')
    attributes('Bundle-Activator': 'org.sensorhub.impl.service.hivemq.Activator')
  }
}

// add info to maven pom
ext.pom >>= {
  developers {
    developer {
      id 'alexrobin'
      name 'Alex Robin'
      organization 'Sensia Software LLC'
      organizationUrl 'http://www.sensiasoftware.com' 
    }
  }
}

